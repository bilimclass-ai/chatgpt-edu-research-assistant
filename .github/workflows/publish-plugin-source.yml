name: Publish plugin source from reviewed bundle
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely unpack and validate plugin
        shell: python
        run: |
          import json, pathlib, stat, zipfile
          root = pathlib.Path.cwd().resolve()
          destination = root / "plugins/chatgpt-edu-research-assistant"
          destination.mkdir(parents=True, exist_ok=True)
          seen = set()
          with zipfile.ZipFile("chatgpt-edu-research-assistant.zip") as archive:
              assert sum(i.file_size for i in archive.infolist()) < 50_000_000
              for entry in archive.infolist():
                  path = pathlib.PurePosixPath(entry.filename.replace("\\", "/"))
                  assert not path.is_absolute() and ".." not in path.parts
                  assert not stat.S_ISLNK(entry.external_attr >> 16)
                  if not path.parts or path.parts[0] not in {".codex-plugin", "skills", "assets"}:
                      continue
                  if entry.is_dir() or entry.filename.endswith(("/", "\\")):
                      continue
                  assert str(path) not in seen, "Duplicate archive path"
                  seen.add(str(path))
                  target = destination.joinpath(*path.parts).resolve()
                  assert target.is_relative_to(destination.resolve())
                  data = archive.read(entry)
                  if target.exists():
                      assert target.read_bytes() == data, "Refusing to replace edited source"
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
          manifest = json.loads((destination / ".codex-plugin/plugin.json").read_text())
          assert manifest["name"] == destination.name
          assert len(list((destination / "skills").glob("*/SKILL.md"))) == 6
          assert (destination / "assets/icon.svg").is_file()
          marketplace = {
              "name": "personal",
              "interface": {"displayName": "ChatGPT EDU Research Assistant"},
              "plugins": [{
                  "name": manifest["name"],
                  "source": {"source": "local", "path": "./plugins/" + manifest["name"]},
                  "policy": {"installation": "AVAILABLE", "authentication": "ON_INSTALL"},
                  "category": "Education"
              }]
          }
          catalog = root / ".agents/plugins/marketplace.json"
          if catalog.exists():
              assert json.loads(catalog.read_text()) == marketplace, "Refusing to replace marketplace"
          else:
              catalog.parent.mkdir(parents=True, exist_ok=True)
              catalog.write_text(json.dumps(marketplace, indent=2) + "\n")
          for agent_file in (destination / "skills").glob("*/agents/openai.yaml"):
              text = agent_file.read_text(encoding="utf-8")
              for indent in ("  ", "    "):
                  old = "  products:\n" + "".join(indent + "- " + product + "\n" for product in ("chatgpt", "codex", "api", "atlas"))
                  text = text.replace(old, "")
              agent_file.write_text(text, encoding="utf-8")
          manifest["version"] = "1.0.1"
          (destination / ".codex-plugin/plugin.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print("Validated six skills, manifest, icon, safe archive paths, and marketplace; normalized v1.0.1 metadata.")
      - name: Commit source and marketplace to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .agents/plugins/marketplace.json plugins/chatgpt-edu-research-assistant
          if git diff --cached --quiet; then
            echo "Source already published; nothing changed."
          else
            git commit -m "Publish six-skill research plugin and GitHub marketplace"
            git push origin HEAD:main
          fi

